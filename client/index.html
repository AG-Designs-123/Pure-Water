    <script>
      // Hide Replit's public feedback widget on the live customer website.

        }
        removeReplitFeedbackWidget();
        new MutationObserver(removeReplitFeedbackWidget).observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
